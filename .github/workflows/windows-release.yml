name: Build Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows x64
        run: dotnet publish desktop/AsciiAquarium.Desktop.csproj -c Release -o dist
      - name: Attach executable to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/AsciiAquarium.exe --draft --verify-tag --generate-notes
